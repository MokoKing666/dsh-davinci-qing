<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="DSH 通过 MCP 桥接驱动 DaVinci Resolve 的剪辑、调色与交付">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1720"/>
      <stop offset="100%" stop-color="#16242f"/>
    </linearGradient>
    <linearGradient id="qing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#2f9fd8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="22" fill="url(#bg)"/>

  <!-- DSH 一侧 -->
  <rect x="36" y="88" width="176" height="150" rx="18" fill="#172833" stroke="#2f4a5c" stroke-width="2"/>
  <text x="58" y="122" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#9ff5e6">DeepSeek Harness</text>
  <rect x="58" y="140" width="132" height="22" rx="6" fill="#22404f"/>
  <rect x="58" y="172" width="132" height="22" rx="6" fill="#22404f"/>
  <rect x="58" y="204" width="88" height="22" rx="6" fill="#2f9fd8" opacity="0.85"/>
  <text x="66" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#8fb6c9">自然语言指令</text>
  <text x="66" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#8fb6c9">工具调用 / 结果</text>

  <!-- 中间：MCP 桥 -->
  <path d="M216 163h74m-12-11 12 11-12 11" fill="none" stroke="url(#qing)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 197H216m12-11-12 11 12 11" fill="none" stroke="#4a6b80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="118" width="66" height="124" rx="14" fill="#152430" stroke="#2f9fd8" stroke-width="2"/>
  <text x="325" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9ff5e6">MCP</text>
  <text x="325" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7fa8bd">36 工具</text>
  <text x="325" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7fa8bd">预检 + 备份</text>
  <text x="325" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7fa8bd">stdio / http</text>

  <!-- Resolve 一侧 -->
  <rect x="386" y="72" width="222" height="182" rx="18" fill="#172833" stroke="#2f4a5c" stroke-width="2"/>
  <text x="406" y="102" font-family="system-ui, sans-serif" font-size="13" fill="#e0a458">DaVinci Resolve Studio</text>

  <!-- 时间线轨道 -->
  <rect x="406" y="114" width="182" height="12" rx="4" fill="#22404f"/>
  <rect x="406" y="114" width="64" height="12" rx="4" fill="#4fd1c5"/>
  <rect x="476" y="114" width="52" height="12" rx="4" fill="#2f9fd8"/>
  <rect x="406" y="132" width="182" height="12" rx="4" fill="#1b3341"/>
  <rect x="446" y="132" width="88" height="12" rx="4" fill="#e0a458" opacity="0.8"/>

  <!-- 标记点 -->
  <g fill="#f2f4f7">
    <circle cx="470" cy="110" r="2.4"/>
    <circle cx="528" cy="110" r="2.4"/>
    <circle cx="534" cy="128" r="2.4"/>
  </g>

  <!-- 调色节点链 -->
  <g stroke="#4a6b80" stroke-width="2" fill="none">
    <path d="M414 178h28m20 0h28m20 0h28"/>
  </g>
  <g fill="#0e1720" stroke="#2f9fd8" stroke-width="2">
    <rect x="406" y="166" width="26" height="24" rx="6"/>
    <rect x="454" y="166" width="26" height="24" rx="6"/>
    <rect x="502" y="166" width="26" height="24" rx="6"/>
    <rect x="550" y="166" width="26" height="24" rx="6"/>
  </g>
  <text x="406" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#7fa8bd">节点树 · LUT · DRX · 截图审片</text>

  <!-- 交付条 -->
  <rect x="406" y="222" width="182" height="18" rx="6" fill="#1b3341"/>
  <rect x="406" y="222" width="120" height="18" rx="6" fill="url(#qing)" opacity="0.85"/>
  <text x="414" y="236" font-family="system-ui, sans-serif" font-size="10" fill="#0b1218">Deliver 渲染队列 渲染中…</text>
</svg>
