# dsh-davinci-qing bundle patch —— DSH 加载器实际读取的本文件
#
# `package.json` 的 `dsh.bundle.patch` 指向这里；加载器把下面这条 row 插进
# profile 的插件层栈，DSH 随后从 `main`（dist/index.js）导入插件并调用
# `apply(ctx, config)`。
#
# 同内容的可读清单版本见 `cordis.yml`（两份必须一致，`npm run check:cordis` 会比对）。

- insert:
    - id: mcp-davinci-qing
      name: 'dsh-davinci-qing'
      config:
        # Python 解释器。留空 = 按 .venv → python → python3 顺序探测。
        pythonPath: ''
        # lib/resolve_bridge.py 的位置；留空用包内默认。
        bridgePath: ''
        # 单次工具调用超时（毫秒）。达芬奇渲染或等待模态对话框时会很久。
        toolTimeoutMs: 180000
        # Python 桥启动超时（毫秒）。
        startupTimeoutMs: 60000
        # Python 桥起不来是否让插件加载失败（false 更稳妥）。
        failOnStartupError: false
        # 透传给 Python 桥的环境变量，例如 { QING_DAVINCI_FAKE: '1' } 走模拟器。
        env: {}
        # 关掉可临时禁用全部工具。
        enabled: true